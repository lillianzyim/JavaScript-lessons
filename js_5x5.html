<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // we will ask the user what 5 x 5 is. They will have 5 tries to get it correct
    let score = 0
    // lowkey should be a for loop cuz we running this for a set # of times but whatever
    // this jawn gotta be lowercase and function gotta be (grouped)
    while (true) {
        // i want to ask the user what 5 x 5 is
        guess = prompt("What is 5 x 5: ")
        // if the answer is correct AND score is not equal to 5
        if ((guess == 25) && (score != 5)) {
            // we say correct
            window.alert("Correct")
            break
        }
        // else if score is equal to 4, meaning 5 attempts
        else if (score == 5) {
            window.alert("You Lose")
            break
        }
        // else
        else {
            // add +1 to the score
            window.alert("Try Again")
            score += 1
            console.log(score)
        }

    }
    </script>
</body>
</html>
