<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input id="input">
    <button onclick="jumble()">Jumble Sentence!</button>
    <h1 id="output"></h1>
    <script>
        function jumble() {
            // let sent = "a hotdog is a sandwich"
            let sent = document.getElementById('input').value
           // convert a sentence into an array
            // split + join
                // splitSent = ["a","hotdog","is","a","sandwich"]
            let splitSent = sent.split(" ")
            // now make a jumbled sentence using a randomizer
        
            // print sentence to screen
            document.getElementById("output").innerHTML = sent
            let jumbSent = []
            for (var i = 0; i<10; i++) {
                jumbSent.push(splitSent[Math.floor(Math.random()*splitSent.length)])
            }
            document.getElementById("output").innerHTML = jumbSent.join(" ")
        } 
        

    </script>
</body>
</html>
