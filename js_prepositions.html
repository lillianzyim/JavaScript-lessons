<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="join()">Join things</button>
    <h1 id="output"></h1>
    <script>
        // build an array of three things
        let things = ["apple","banana","orange"]
        // build an array of a few prepositions
        let prep = ["with", "among", "by", "behind", "above", "near"]
        // join the array items using a random preposition
        // dont forget the spaces
        function join() {
            let pr = prep[Math.floor(Math.random()*prep.length)]
            document.getElementById("output").innerHTML = things.join(" " + pr + " ") 
        }
    </script>
</body>
</html>
